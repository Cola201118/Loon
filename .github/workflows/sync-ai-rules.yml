name: Sync upstream AI rules

on:
  push:
    paths:
      - ".github/workflows/sync-ai-rules.yml"
      - "rules/AI/Grok.manual.list"
      - "rules/AI/Muse.manual.list"
  workflow_dispatch:
  schedule:
    - cron: "27 */6 * * *"

permissions:
  contents: write

concurrency:
  group: loon-rules-sync-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Download and merge AI rules
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error "https://raw.githubusercontent.com/poohyeban/loon-rules/main/rules/OpenAI/OpenAI-NoResolve.list" -o rules/AI/OpenAI-NoResolve.list
          curl --fail --location --silent --show-error "https://raw.githubusercontent.com/VPSDance/ai-proxy-rules/main/rules/loon/google-ai.list" -o rules/AI/Gemini.list
          test -s rules/AI/OpenAI-NoResolve.list
          test -s rules/AI/Gemini.list
          {
            echo "# AI rules (OpenAI + Gemini + Grok + Muse, deduplicated)"
            echo "# OpenAI source preserves no-resolve IP rules."
            echo "# Grok/Muse sections are appended after standalone extract."
            cat rules/AI/OpenAI-NoResolve.list
            echo
            cat rules/AI/Gemini.list
          } | awk '
            {
              original = $0
              key = $0
              sub(/[[:space:]]*#.*/, "", key)
              gsub(/^[[:space:]]+|[[:space:]]+$/, "", key)
              if (key == "" || key ~ /^#/) {
                if (original ~ /^[[:space:]]*#/) print original
                next
              }
              key = tolower(key)
              gsub(/[[:space:]]+/, "", key)
              if (!seen[key]++) print original
            }
          ' > rules/AI.list


      - name: Extract standalone Muse and Grok rules
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error "https://raw.githubusercontent.com/YUDIDIFEI/Scripts/master/rule/Loon/AI/AI.list" -o /tmp/upstream-ai.list
          test -s /tmp/upstream-ai.list

          # Extract complete upstream categories. Known section headings terminate a
          # category; ordinary comments inside a category are preserved, not treated
          # as end markers. Update the heading set if the upstream adds new categories.
          python3 - <<'PY'
          from pathlib import Path

          source = Path("/tmp/upstream-ai.list").read_text(encoding="utf-8").splitlines()
          headings = {
              "OpenAI / ChatGPT / Codex / Sora / Sites / Crixet", "Anthropic / Claude",
              "Google Gemini / Gemma / Workspace / AI Studio / NotebookLM / Code Assist",
              "GitHub Copilot / GitHub Models", "Perplexity", "xAI / Grok / Grokipedia",
              "Poe", "Cursor", "Windsurf / Codeium", "JetBrains AI", "Hugging Face",
              "Groq", "Cerebras", "ElevenLabs", "Microsoft Copilot", "Mistral / Le Chat",
              "Cohere", "Midjourney", "OpenRouter", "Meta AI / Muse / Llama / SAM",
              "Civitai", "Suno", "Runway", "Character.AI", "Stability AI", "Syntx.AI",
              "Jev / System One", "Magnific", "Artificial Analysis", "Cline",
              "CommandCode", "Context7", "Nous Research",
          }

          def extract(marker, output, title, supplement):
              matches = [i for i, line in enumerate(source) if line == "# " + marker]
              if len(matches) != 1:
                  raise SystemExit(f"Expected exactly one upstream section {marker!r}; found {len(matches)}")
              start = matches[0]
              end = next((i for i in range(start + 1, len(source))
                          if source[i].startswith("# ") and source[i][2:] in headings), len(source))
              section = source[start:end]
              rules = [line for line in section if line.strip() and not line.lstrip().startswith("#")]
              if not rules:
                  raise SystemExit(f"Upstream section {marker!r} contains no rules")
              if any("," not in line for line in rules):
                  raise SystemExit(f"Malformed rule in upstream section {marker!r}")
              output_lines = [
                  f"# {title} rules",
                  f"# Source classification: {marker}",
                  "# Upstream: YUDIDIFEI/Scripts rule/Loon/AI/AI.list",
                  f"# Local supplements: rules/AI/{supplement} (merged into AI.list only)",
                  *section,
                  "",
              ]
              Path(output).write_text("\n".join(output_lines), encoding="utf-8")
              print(f"{title}: extracted {len(rules)} upstream rules")

          extract("Meta AI / Muse / Llama / SAM", "rules/AI/Muse.list", "Muse", "Muse.manual.list")
          extract("xAI / Grok / Grokipedia", "rules/AI/Grok.list", "Grok", "Grok.manual.list")
          PY

          # --- Merge into AI.list: upstream Grok/Muse + local manuals, deduplicated ---
          python3 - <<'PY'
          from pathlib import Path

          def is_rule(line: str) -> bool:
              s = line.strip()
              return bool(s) and not s.startswith("#")

          def key(line: str) -> str:
              return "".join(line.lower().split())

          ai_path = Path("rules/AI.list")
          ai_lines = ai_path.read_text(encoding="utf-8").splitlines()
          existing = {key(l) for l in ai_lines if is_rule(l)}

          def collect(*paths: Path):
              out = []
              for path in paths:
                  if not path.exists():
                      continue
                  for line in path.read_text(encoding="utf-8").splitlines():
                      if not is_rule(line):
                          continue
                      k = key(line)
                      if k in existing:
                          continue
                      existing.add(k)
                      out.append(line.strip())
              return out

          # Grok: upstream list + local manual (manual is NOT written into Grok.list)
          grok_added = collect(Path("rules/AI/Grok.list"), Path("rules/AI/Grok.manual.list"))
          # Muse: same pattern for consistency
          muse_added = collect(Path("rules/AI/Muse.list"), Path("rules/AI/Muse.manual.list"))

          blocks = []
          if grok_added:
              blocks.append("# ===== xAI / Grok (Grok.list + Grok.manual.list) =====")
              blocks.extend(grok_added)
          if muse_added:
              blocks.append("# ===== Meta AI / Muse (Muse.list + Muse.manual.list) =====")
              blocks.extend(muse_added)

          if blocks:
              text = ai_path.read_text(encoding="utf-8").rstrip() + "\n\n" + "\n".join(blocks) + "\n"
              ai_path.write_text(text, encoding="utf-8")
              print(f"AI.list merged: +{len(grok_added)} Grok, +{len(muse_added)} Muse")
          else:
              print("AI.list already contains all Grok/Muse rules")
          PY
          python3 - <<'PY'
          from pathlib import Path
          from datetime import datetime, timezone
          from collections import Counter
          path = Path("rules/AI.list")
          lines = path.read_text(encoding="utf-8").splitlines()
          rules = [line.strip() for line in lines if line.strip() and not line.lstrip().startswith("#")]
          counts = Counter(line.split(",", 1)[0].strip().upper() for line in rules)
          rules.sort(key=lambda line: ({"DOMAIN": 0, "DOMAIN-SUFFIX": 1, "DOMAIN-KEYWORD": 2, "USER-AGENT": 3, "IP-ASN": 4, "IP-CIDR": 5, "IP-CIDR6": 6, "PROCESS-NAME": 7}.get(line.split(",", 1)[0].strip().upper(), 99), line.split(",", 1)[1].casefold() if "," in line and not line.startswith("USER-AGENT,") else (line.split(",", 1)[1] if "," in line else ""), line.casefold()))
          count = len(rules)
          import re
          lines = [line for line in lines if not line.startswith(("# NAME:", "# SOURCE:", "# UPDATED:", "# SOURCES:", "# TOTAL:")) and not re.match(r"^# [A-Z0-9-]+: \d+$", line)]
          header = ["# NAME: AI", "# SOURCE: OpenAI + Gemini + Grok + Muse", "# UPDATED: " + datetime.now(timezone.utc).strftime("%Y-%m-%d %H:%M:%S UTC"), "# SOURCES: OpenAI-NoResolve.list + Gemini.list + Grok.list + Grok.manual.list + Muse.list + Muse.manual.list", *[f"# {kind}: {counts[kind]}" for kind in sorted(counts)], f"# TOTAL: {count}", ""]
          notes = ["# AI rules (OpenAI + Gemini + Grok + Muse, deduplicated and sorted)"]
          path.write_text("\n".join([*header, *notes, *rules]).rstrip() + "\n", encoding="utf-8")
          print(f"AI.list actual rule count: {count}")
          PY


      - name: Validate generated AI rules
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          source_path = Path("/tmp/upstream-ai.list")
          if not source_path.is_file() or not source_path.stat().st_size:
              raise SystemExit("Upstream AI source is missing or empty")
          source = source_path.read_text(encoding="utf-8").splitlines()
          headings = {
              "OpenAI / ChatGPT / Codex / Sora / Sites / Crixet", "Anthropic / Claude",
              "Google Gemini / Gemma / Workspace / AI Studio / NotebookLM / Code Assist",
              "GitHub Copilot / GitHub Models", "Perplexity", "xAI / Grok / Grokipedia",
              "Poe", "Cursor", "Windsurf / Codeium", "JetBrains AI", "Hugging Face",
              "Groq", "Cerebras", "ElevenLabs", "Microsoft Copilot", "Mistral / Le Chat",
              "Cohere", "Midjourney", "OpenRouter", "Meta AI / Muse / Llama / SAM",
              "Civitai", "Suno", "Runway", "Character.AI", "Stability AI", "Syntx.AI",
              "Jev / System One", "Magnific", "Artificial Analysis", "Cline",
              "CommandCode", "Context7", "Nous Research",
          }

          def normalize(line):
              return "".join(line.split()).lower()

          def upstream_rules(marker):
              matches = [i for i, line in enumerate(source) if line == "# " + marker]
              if len(matches) != 1:
                  raise SystemExit(f"Expected exactly one upstream section {marker!r}; found {len(matches)}")
              start = matches[0] + 1
              end = next((i for i in range(start, len(source))
                          if source[i].startswith("# ") and source[i][2:] in headings), len(source))
              return [line.strip() for line in source[start:end]
                      if line.strip() and not line.lstrip().startswith("#")]

          for marker, filename in (
              ("Meta AI / Muse / Llama / SAM", "AI/Muse.list"),
              ("xAI / Grok / Grokipedia", "AI/Grok.list"),
          ):
              actual = [line.strip() for line in (Path("rules") / filename).read_text(encoding="utf-8").splitlines()
                        if line.strip() and not line.lstrip().startswith("#")]
              expected = upstream_rules(marker)
              if [normalize(x) for x in actual] != [normalize(x) for x in expected]:
                  raise SystemExit(f"{filename} does not match its complete upstream category: expected {len(expected)}, got {len(actual)}")

          ai_rules = {
              normalize(line.split("//", 1)[0].strip())
              for line in Path("rules/AI.list").read_text(encoding="utf-8").splitlines()
              if line.strip() and not line.lstrip().startswith("#")
          }
          for filename in ("AI/Grok.list", "AI/Grok.manual.list", "AI/Muse.list", "AI/Muse.manual.list"):
              for line in (Path("rules") / filename).read_text(encoding="utf-8").splitlines():
                  if line.strip() and not line.lstrip().startswith("#"):
                      if normalize(line.split("//", 1)[0].strip()) not in ai_rules:
                          raise SystemExit(f"AI.list is missing a rule from {filename}: {line}")

          for name in ("AI.list", "AI/Muse.list", "AI/Grok.list"):
              path = Path("rules") / name
              if not path.is_file() or path.stat().st_size == 0:
                  raise SystemExit(f"{name} is missing or empty")
              rules = []
              for raw in path.read_text(encoding="utf-8").splitlines():
                  line = raw.strip()
                  if not line or line.startswith("#"):
                      continue
                  line = line.split("//", 1)[0].strip()
                  if not line or "," not in line:
                      raise SystemExit(f"{name} contains malformed rule: {raw}")
                  rules.append("".join(line.lower().split()))
              if not rules:
                  raise SystemExit(f"{name} contains no rules")
              if name == "AI.list":
                  import re
                  match = re.search(r"^# TOTAL: (\d+)$", path.read_text(encoding="utf-8"), re.M)
                  if not match or int(match.group(1)) != len(rules):
                      raise SystemExit("AI.list # TOTAL does not match its actual rule count")
              if len(rules) != len(set(rules)):
                  raise SystemExit(f"{name} contains duplicate rules")
              if name == "AI.list":
                  from collections import Counter
                  expected = Counter(line.split(",", 1)[0].strip().upper() for line in rules)
                  header_counts = {}
                  for raw in path.read_text(encoding="utf-8").splitlines():
                      match = re.match(r"^# ([A-Z0-9-]+): (\d+)$", raw)
                      if match and match.group(1) not in ("NAME", "TOTAL"):
                          header_counts[match.group(1)] = int(match.group(2))
                  if header_counts != dict(expected):
                      raise SystemExit(f"AI.list per-type counts mismatch: expected {dict(expected)}, got {header_counts}")
              print(f"{name}: {len(rules)} rules; validation passed")
          PY

      - name: Commit changes when needed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rules/AI.list rules/AI/OpenAI-NoResolve.list rules/AI/Gemini.list rules/AI/Muse.list rules/AI/Grok.list
          if git diff --cached -I '^# UPDATED:' --quiet; then
            echo "No upstream rule changes (timestamp-only differences ignored)."
            git restore --source=HEAD --staged --worktree -- rules/AI.list rules/AI/OpenAI-NoResolve.list rules/AI/Gemini.list rules/AI/Muse.list rules/AI/Grok.list
            exit 0
          fi
          git commit -m "Sync upstream AI rules"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push; then
              exit 0
            fi
            git rebase --abort >/dev/null 2>&1 || true
            if [ "$attempt" -lt 5 ]; then
              sleep "$((attempt * 2))"
            fi
          done
          echo "Unable to push rule updates after 5 attempts."
          exit 1
