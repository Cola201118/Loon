name: Sync upstream China rules

on:
  push:
    paths:
      - ".github/workflows/sync-china-rules.yml"
  workflow_dispatch:
  schedule:
    - cron: "37 */6 * * *"

permissions:
  contents: write

concurrency:
  group: loon-rules-sync-main
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download and merge upstream Loon rules
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p rules/China
          python3 <<'PY'
          from datetime import datetime, timezone
          from urllib.request import urlopen

          sources = {
              "ChinaMax.list": "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Loon/ChinaMax/ChinaMax.list",
              "ChinaMax_Domain.list": "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Loon/ChinaMax/ChinaMax_Domain.list",
              "ChinaASN.list": "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Loon/ChinaASN/ChinaASN.list",
              "Lan.list": "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Loon/Lan/Lan.list",
          }

          rules = []
          source_counts = {}

          for name, url in sources.items():
              request = urlopen(url, timeout=90)
              text = request.read().decode("utf-8")
              if not text.strip():
                  raise RuntimeError(f"Upstream source is empty: {name}")

              # Keep every upstream input as its own raw subscription file.
              with open("rules/China/" + name, "w", encoding="utf-8") as raw_file:
                  raw_file.write(text)

              entries = [
                  line.strip()
                  for line in text.splitlines()
                  if line.strip() and not line.lstrip().startswith("#")
              ]

              # ChinaMax_Domain.list is a domain-set file:
              # leading-dot entries are suffix matches; other entries are exact domains.
              if name == "ChinaMax_Domain.list":
                  entries = [
                      "DOMAIN-SUFFIX," + line[1:] if line.startswith(".")
                      else "DOMAIN," + line
                      for line in entries
                  ]

              if not entries:
                  raise RuntimeError(f"No rules found in upstream source: {name}")
              source_counts[name] = len(entries)
              rules.extend(entries)

          # Deduplicate only semantically identical rules. Domain values are
          # case-insensitive; USER-AGENT values and all trailing options are preserved.
          def rule_key(line):
              parts = [part.strip() for part in line.split(",")]
              kind = parts[0].upper()
              value = parts[1] if len(parts) > 1 else ""
              if kind != "USER-AGENT":
                  value = value.casefold()
              options = tuple(part.casefold() for part in parts[2:])
              return (kind, value, options)

          unique_by_key = {}
          for line in rules:
              unique_by_key.setdefault(rule_key(line), line)
          unique = list(unique_by_key.values())
          if not unique:
              raise RuntimeError("Generated rule list is empty")
          malformed = [line for line in unique if "," not in line]
          if malformed:
              raise RuntimeError(f"Malformed Loon rules detected: {malformed[:5]}")
          unique.sort(key=lambda line: (
              line.split(",", 1)[0].upper(),
              line.split(",", 1)[1].casefold() if "," in line and not line.startswith("USER-AGENT,") else (line.split(",", 1)[1] if "," in line else ""),
              line.casefold(),
          ))

          generated = [
              "# NAME: China",
              "# SOURCE: blackmatrix7/ios_rule_script (Loon)",
              "# UPDATED: " + datetime.now(timezone.utc).strftime("%Y-%m-%d %H:%M:%S UTC"),
              "# INPUT TOTAL: " + str(len(rules)),
              "# DEDUPLICATED: " + str(len(rules) - len(unique)),
              "# TOTAL: " + str(len(unique)),
              "# SOURCES: ChinaMax.list + ChinaMax_Domain.list + ChinaASN.list + Lan.list",
              "# ChinaMax_Domain entries converted to DOMAIN / DOMAIN-SUFFIX rules",
              "",
              *unique,
              "",
          ]

          with open("rules/China.list", "w", encoding="utf-8", newline="\n") as f:
              f.write("\n".join(generated))

          print("Source counts:", source_counts)
          print("Input rules:", len(rules))
          print("Duplicates removed:", len(rules) - len(unique))
          print("Final rules:", len(unique))
          PY

      - name: Validate generated China rules
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          sources = ("ChinaMax.list", "ChinaMax_Domain.list", "ChinaASN.list", "Lan.list")
          for name in sources:
              path = Path("rules/China") / name
              if not path.is_file() or path.stat().st_size == 0:
                  raise SystemExit(f"Missing or empty source file: {path}")
          path = Path("rules/China.list")
          lines = path.read_text(encoding="utf-8").splitlines()
          rules = [line.strip() for line in lines if line.strip() and not line.lstrip().startswith("#")]
          if not rules:
              raise SystemExit("China.list contains no rules")
          malformed = [line for line in rules if "," not in line]
          if malformed:
              raise SystemExit(f"Malformed China rules: {malformed[:5]}")
          def key(line):
              parts = [part.strip() for part in line.split(",")]
              kind = parts[0].upper()
              value = parts[1] if len(parts) > 1 else ""
              if kind != "USER-AGENT":
                  value = value.casefold()
              return (kind, value, tuple(part.casefold() for part in parts[2:]))
          if len({key(line) for line in rules}) != len(rules):
              raise SystemExit("China.list contains duplicate rules")
          match = re.search(r"^# TOTAL: (\d+)$", "\n".join(lines), re.M)
          if not match or int(match.group(1)) != len(rules):
              raise SystemExit(f"China.list # TOTAL mismatch: actual {len(rules)}")
          print(f"China.list: {len(rules)} rules; validation passed")
          PY

      - name: Commit changes when needed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rules/China/ChinaMax.list rules/China/ChinaMax_Domain.list rules/China/ChinaASN.list rules/China/Lan.list rules/China.list
          if git diff --cached --quiet; then
            echo "No upstream changes."
            exit 0
          fi
          git commit -m "Sync upstream China rules"
          git pull --rebase origin main
          git push
