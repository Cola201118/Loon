name: Sync upstream Apple rules

on:
  push:
    paths:
      - ".github/workflows/sync-apple-rules.yml"
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: loon-rules-sync-main
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download upstream rule files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p rules
          curl --fail --location --silent --show-error "https://raw.githubusercontent.com/Kianuni/AppleFlow/main/rules/surge/Siri-Direct.list" -o rules/Apple/Siri.list
          curl --fail --location --silent --show-error "https://raw.githubusercontent.com/Kianuni/AppleFlow/main/rules/surge/Apple-APNs-Direct.list" -o rules/Apple/Apple-APNs.list
          curl --fail --location --silent --show-error "https://raw.githubusercontent.com/o-ocn/loon-rules/main/dist/Apple-Direct.lsr" -o rules/Apple/Apple.lsr
          test -s rules/Apple/Siri.list
          test -s rules/Apple/Apple-APNs.list
          test -s rules/Apple/Apple.lsr
          {
            echo "# Apple rules (deduplicated)"
            echo "# Generated from the three upstream sources below."
            echo
            echo "# ===== rules/Apple/Siri.list ====="
            cat rules/Apple/Siri.list
            echo
            echo "# ===== rules/Apple/Apple-APNs.list ====="
            cat rules/Apple/Apple-APNs.list
            echo
            echo "# ===== rules/Apple/Apple.lsr ====="
            cat rules/Apple/Apple.lsr
          } | awk '
            {
              original = $0
              key = $0
              sub(/[[:space:]]*\/\/.*/, "", key)
              gsub(/^[[:space:]]+|[[:space:]]+$/, "", key)
              if (key == "" || key ~ /^#/) {
                if (original ~ /^[[:space:]]*#/) print original
                next
              }
              key = tolower(key)
              gsub(/[[:space:]]+/, "", key)
              # Remove only Apple Music-exclusive domain rules; keep shared iTunes/CDN rules.
              if (key == "domain-suffix,applemusic.com" || key == "domain-suffix,music.apple.com") next
              if (!seen[key]++) print original
            }
          ' > rules/Apple.list
          python3 - <<'PY'
          from pathlib import Path
          path = Path("rules/Apple.list")
          lines = path.read_text(encoding="utf-8").splitlines()
          count = sum(
              1 for line in lines
              if line.strip() and not line.lstrip().startswith("#")
          )
          header = [
              "# NAME: Apple",
              f"# GENERATED TOTAL: {count}",
              "# GENERATED SOURCES: Siri.list + Apple-APNs.list + Apple.lsr",
              "",
          ]
          path.write_text("\n".join(header + lines).rstrip() + "\n", encoding="utf-8")
          print(f"Generated Apple rules: {count}")
          PY


      - name: Validate generated Apple rules
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path("rules/Apple.list")
          if not path.is_file() or path.stat().st_size == 0:
              raise SystemExit("Apple.list is missing or empty")
          rules = []
          for raw in path.read_text(encoding="utf-8").splitlines():
              line = raw.strip()
              if not line or line.startswith("#"):
                  continue
              line = line.split("//", 1)[0].strip()
              if not line or "," not in line:
                  raise SystemExit(f"Apple.list contains malformed rule: {raw}")
              rules.append("".join(line.lower().split()))
          if not rules:
              raise SystemExit("Apple.list contains no rules")
          if len(rules) != len(set(rules)):
              raise SystemExit("Apple.list contains duplicate rules")
          print(f"Apple.list: {len(rules)} rules; validation passed")
          PY

      - name: Commit changes when needed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rules/Apple.list rules/Apple/Siri.list rules/Apple/Apple-APNs.list rules/Apple/Apple.lsr
          if git diff --cached --quiet; then
            echo "No upstream changes."
            exit 0
          fi
          git commit -m "Sync upstream Apple rules"
          git pull --rebase origin main
          git push
