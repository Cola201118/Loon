name: Sync upstream Apple rules

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download upstream rule files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p rules
          curl --fail --location --silent --show-error "https://raw.githubusercontent.com/Kianuni/AppleFlow/main/rules/surge/Siri-Direct.list" -o rules/Siri-Direct.list
          curl --fail --location --silent --show-error "https://raw.githubusercontent.com/Kianuni/AppleFlow/main/rules/surge/Apple-APNs-Direct.list" -o rules/Apple-APNs-Direct.list
          curl --fail --location --silent --show-error "https://raw.githubusercontent.com/o-ocn/loon-rules/main/dist/Apple-Direct.lsr" -o rules/Apple-Direct.lsr
          {
            echo "# Combined Apple direct rules (deduplicated)"
            echo "# Generated from the three upstream sources below."
            echo
            echo "# ===== rules/Siri-Direct.list ====="
            cat rules/Siri-Direct.list
            echo
            echo "# ===== rules/Apple-APNs-Direct.list ====="
            cat rules/Apple-APNs-Direct.list
            echo
            echo "# ===== rules/Apple-Direct.lsr ====="
            cat rules/Apple-Direct.lsr
          } | awk '
            {
              original = $0
              key = $0
              sub(/[[:space:]]*\/\/.*/, "", key)
              gsub(/^[[:space:]]+|[[:space:]]+$/, "", key)
              if (key == "" || key ~ /^#/) {
                if (original ~ /^[[:space:]]*#/) print original
                next
              }
              key = tolower(key)
              gsub(/[[:space:]]+/, "", key)
              # Remove only Apple Music-exclusive domain rules; keep shared iTunes/CDN rules.
              if (key == "domain-suffix,applemusic.com" || key == "domain-suffix,music.apple.com") next
              if (!seen[key]++) print original
            }
          ' > rules/Apple-Combined.list

      - name: Commit changes when needed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rules/
          if git diff --cached --quiet; then
            echo "No upstream changes."
            exit 0
          fi
          git commit -m "Sync upstream Apple rules"
          git push
