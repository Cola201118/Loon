name: Sync upstream Apple rules

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download upstream rule files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p rules
          curl --fail --location --silent --show-error "https://raw.githubusercontent.com/Kianuni/AppleFlow/main/rules/surge/Siri-Direct.list" -o rules/Siri.list
          curl --fail --location --silent --show-error "https://raw.githubusercontent.com/Kianuni/AppleFlow/main/rules/surge/Apple-APNs-Direct.list" -o rules/Apple-APNs.list
          curl --fail --location --silent --show-error "https://raw.githubusercontent.com/o-ocn/loon-rules/main/dist/Apple-Direct.lsr" -o rules/Apple.lsr
          {
            echo "# Apple rules (deduplicated)"
            echo "# Generated from the three upstream sources below."
            echo
            echo "# ===== rules/Siri.list ====="
            cat rules/Siri.list
            echo
            echo "# ===== rules/Apple-APNs.list ====="
            cat rules/Apple-APNs.list
            echo
            echo "# ===== rules/Apple.lsr ====="
            cat rules/Apple.lsr
          } | awk '
            {
              original = $0
              key = $0
              sub(/[[:space:]]*\/\/.*/, "", key)
              gsub(/^[[:space:]]+|[[:space:]]+$/, "", key)
              if (key == "" || key ~ /^#/) {
                if (original ~ /^[[:space:]]*#/) print original
                next
              }
              key = tolower(key)
              gsub(/[[:space:]]+/, "", key)
              # Remove only Apple Music-exclusive domain rules; keep shared iTunes/CDN rules.
              if (key == "domain-suffix,applemusic.com" || key == "domain-suffix,music.apple.com") next
              if (!seen[key]++) print original
            }
          ' > rules/Apple.list


      - name: Download and merge AI rules
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error "https://raw.githubusercontent.com/poohyeban/loon-rules/main/rules/OpenAI/OpenAI-NoResolve.list" -o rules/OpenAI-NoResolve.list
          curl --fail --location --silent --show-error "https://raw.githubusercontent.com/VPSDance/ai-proxy-rules/main/rules/loon/google-ai.list" -o rules/Gemini.list
          {
            echo "# AI rules (OpenAI + Gemini + Grok + Muse, deduplicated)"
            echo "# OpenAI source preserves no-resolve IP rules."
            echo "# Grok/Muse sections are appended after standalone extract."
            cat rules/OpenAI-NoResolve.list
            echo
            cat rules/Gemini.list
          } | awk '
            {
              original = $0
              key = $0
              sub(/[[:space:]]*#.*/, "", key)
              gsub(/^[[:space:]]+|[[:space:]]+$/, "", key)
              if (key == "" || key ~ /^#/) {
                if (original ~ /^[[:space:]]*#/) print original
                next
              }
              key = tolower(key)
              gsub(/[[:space:]]+/, "", key)
              if (!seen[key]++) print original
            }
          ' > rules/AI.list


      - name: Extract standalone Muse and Grok rules
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error "https://raw.githubusercontent.com/YUDIDIFEI/Scripts/master/rule/Loon/AI/AI.list" -o /tmp/upstream-ai.list

          # --- Muse: upstream extract + local manual ---
          {
            echo "# Muse rules"
            echo "# Source classification: Meta AI / Muse / Llama / SAM"
            echo "# Upstream: YUDIDIFEI/Scripts rule/Loon/AI/AI.list"
            awk 'BEGIN { found=0; active=0 } /^# Meta AI \/ Muse \/ Llama \/ SAM$/ { found=1; active=1 } active { if ($0 == "" && found) exit; print } END { if (!found) exit 2 }' /tmp/upstream-ai.list
          } > rules/Muse.list
          if [ -f rules/Muse.manual.list ]; then
            {
              echo
              echo "# Manual supplement (not from upstream, preserved by workflow)"
              echo "# Source: rules/Muse.manual.list"
              grep -E '^(DOMAIN|DOMAIN-SUFFIX|DOMAIN-KEYWORD|IP-CIDR|IP-CIDR6|PROCESS-NAME|USER-AGENT)' rules/Muse.manual.list || true
            } >> rules/Muse.list
          fi

          # --- Grok: upstream extract + local manual ---
          {
            echo "# Grok rules"
            echo "# Source classification: xAI / Grok / Grokipedia"
            echo "# Upstream: YUDIDIFEI/Scripts rule/Loon/AI/AI.list"
            awk 'BEGIN { found=0; active=0 } /^# xAI \/ Grok \/ Grokipedia$/ { found=1; active=1 } active { if ($0 == "" && found) exit; print } END { if (!found) exit 2 }' /tmp/upstream-ai.list
          } > rules/Grok.list
          if [ -f rules/Grok.manual.list ]; then
            {
              echo
              echo "# Manual supplement (not from upstream, preserved by workflow)"
              echo "# Source: rules/Grok.manual.list"
              grep -E '^(DOMAIN|DOMAIN-SUFFIX|DOMAIN-KEYWORD|IP-CIDR|IP-CIDR6|PROCESS-NAME|USER-AGENT)' rules/Grok.manual.list || true
            } >> rules/Grok.list
          fi

          # --- Merge Grok + Muse into AI.list (primary subscription) ---
          # Deduplicate against existing AI.list rules so only new lines are added.
          python3 - <<'PY'
          from pathlib import Path

          def is_rule(line: str) -> bool:
              s = line.strip()
              return bool(s) and not s.startswith("#")

          def key(line: str) -> str:
              return "".join(line.lower().split())

          ai_path = Path("rules/AI.list")
          ai_lines = ai_path.read_text(encoding="utf-8").splitlines()
          existing = {key(l) for l in ai_lines if is_rule(l)}

          def collect(path: Path):
              if not path.exists():
                  return []
              out = []
              for line in path.read_text(encoding="utf-8").splitlines():
                  if not is_rule(line):
                      continue
                  k = key(line)
                  if k in existing:
                      continue
                  existing.add(k)
                  out.append(line.strip())
              return out

          grok_added = collect(Path("rules/Grok.list"))
          muse_added = collect(Path("rules/Muse.list"))

          blocks = []
          if grok_added:
              blocks.append("# ===== xAI / Grok (from Grok.list + Grok.manual.list) =====")
              blocks.extend(grok_added)
          if muse_added:
              blocks.append("# ===== Meta AI / Muse (from Muse.list + Muse.manual.list) =====")
              blocks.extend(muse_added)

          if blocks:
              text = ai_path.read_text(encoding="utf-8").rstrip() + "\n\n" + "\n".join(blocks) + "\n"
              ai_path.write_text(text, encoding="utf-8")
              print(f"AI.list merged: +{len(grok_added)} Grok, +{len(muse_added)} Muse")
          else:
              print("AI.list already contains all Grok/Muse rules")
          PY


      - name: Merge B7 Steam rules into Proxy
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Loon/Steam/Steam.list" -o /tmp/b7-steam.list
          python3 - <<'PY'
          from pathlib import Path

          path = Path("rules/Proxy.list")
          content = path.read_text(encoding="utf-8")
          marker = "# ===== B7 Steam ====="
          if marker in content:
              content = content.split(marker, 1)[0].rstrip()
          lines = content.splitlines()

          def number(name):
              prefix = f"# {name}: "
              for line in lines[:20]:
                  if line.startswith(prefix):
                      return int(line[len(prefix):])
              return 0

          def is_rule(line):
              value = line.strip()
              return bool(value) and not value.startswith("#")

          def key(line):
              return "".join(line.lower().split())

          old_steam_input = number("STEAM INPUT")
          old_steam_dedup = number("STEAM DEDUPLICATED")
          base_input = number("INPUT TOTAL") - old_steam_input
          base_dedup = number("DEDUPLICATED") - old_steam_dedup
          base_rules = [line for line in lines[10:] if is_rule(line)]
          existing = {key(line) for line in base_rules}
          steam_lines = [line.strip() for line in Path("/tmp/b7-steam.list").read_text(encoding="utf-8").splitlines() if is_rule(line)]

          added = []
          seen = set()
          duplicates = 0
          for line in steam_lines:
              normalized = key(line)
              if normalized in existing or normalized in seen:
                  duplicates += 1
                  continue
              seen.add(normalized)
              added.append(line)

          total = len(base_rules) + len(added)
          for i, line in enumerate(lines[:10]):
              if line.startswith("# INPUT TOTAL:"):
                  lines[i] = f"# INPUT TOTAL: {base_input + len(steam_lines)}"
              elif line.startswith("# DEDUPLICATED:"):
                  lines[i] = f"# DEDUPLICATED: {base_dedup + duplicates}"
              elif line.startswith("# TOTAL:"):
                  lines[i] = f"# TOTAL: {total}"
              elif line.startswith("# SOURCES:") and "B7 Steam.list" not in line:
                  lines[i] = line + " + B7 Steam.list"

          lines = [line for line in lines if not line.startswith("# STEAM INPUT:") and not line.startswith("# STEAM DEDUPLICATED:")]
          lines.insert(10, f"# STEAM INPUT: {len(steam_lines)}")
          lines.insert(11, f"# STEAM DEDUPLICATED: {duplicates}")
          output = "\n".join(lines).rstrip() + "\n\n" + marker + "\n" + "\n".join(added) + "\n"
          path.write_text(output, encoding="utf-8")
          print(f"Steam source: {len(steam_lines)}; duplicates: {duplicates}; added: {len(added)}; Proxy total: {total}")
          PY

      - name: Commit changes when needed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rules/
          if git diff --cached --quiet; then
            echo "No upstream changes."
            exit 0
          fi
          git commit -m "Sync upstream Apple rules"
          git push
